server:
  host: "0.0.0.0"
  port: 8080
  read_header_timeout: "10s"
  idle_timeout: "300s"
  shutdown_drain_timeout: "120s"
  max_request_body_bytes: 104857600 # 100 MiB (supports 1M+ context & multimodal payloads)
  sse_keepalive_interval: "15s"

security:
  api_keys:
    - id: "prod-client-1"
      key_env: "AGY_GW_CLIENT_KEY_1"
      key: "sk-antigravity-dev-test"
      rate_limit_rpm: 120
  admin_api_key_env: "AGY_GW_ADMIN_KEY"
  admin_api_key: "admin-super-secret-key-change-me"
  allowed_cors_origins: []

binaries:
  agy_path: "/usr/local/bin/agy"
  agy_min_version: "1.5.16"
  agy_auth_path: "/usr/local/bin/agy-auth"
  agy_acp_args:
    - "acp"

execution:
  acp_session_mode: "accept-edits"
  auto_approve_permissions: true
  system_prompt_channel: "auto" # auto|standard|vendor|both
  vision_mode: "reject"         # reject|flatten - agy cannot process images
  clean_workspace_between_requests: true

storage:
  base_data_dir: "/var/lib/agy-gateway"
  vault_xdg_config_dir: "/var/lib/agy-gateway/vault-xdg"
  workers_root_dir: "/var/lib/agy-gateway/workers"
  workers_tmp_dir: "/var/lib/agy-gateway/tmp"
  workspaces_root_dir: "/var/lib/agy-gateway/workspaces"

pool:
  worker_count: 2
  acquire_timeout: "15s"
  handshake_timeout: "15s"
  config_switch_timeout: "10s"
  inference_timeout: "900s"
  first_token_timeout: "120s"
  process_kill_grace_period: "5s"
  max_requests_per_worker: 250
  max_worker_uptime: "2h"
  max_scanner_buffer_bytes: 134217728 # 128 MiB (prevents buffer overflow on 1M token turns)

accounts:
  auto_rotate_enabled: true
  # round_robin: spread by index | least_used: greedy over live quota and claim counts |
  # sticky: persist per-worker affinity in <base_data_dir>/state/worker-bindings.json, honouring a
  # binding only while the account still exists, is usable, and is not claimed by an earlier worker.
  allocation_strategy: "round_robin"
  quota_poll_interval: "30s"
  min_remaining_quota_pct: 5.0
  default_cooldown_5h: "30m"
  default_cooldown_weekly: "24h"
  max_failover_retries: 2
  # Bounded retry for a runtime credential fault; a vault-reported expiry stays permanent.
  auth_expired_retry_interval: "5m"

admin:
  command_timeout: "15s"
  allow_credential_export: false
  query_validation_regex: "^[a-zA-Z0-9@._:-]{1,128}$"
  alias_validation_regex: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,62}$"
  runtime_overrides_file: "/var/lib/agy-gateway/vault-xdg/gateway-runtime-overrides.json"
  oauth_onboarding:
    enabled: true
    max_concurrent_logins: 3
    url_extract_timeout: "10s"
    login_session_ttl: "5m"
    loopback_replay_timeout: "15s"

openai:
  unsupported_param_policy: "strip_and_warn"
  default_model: "gemini-3.8-flash"
  default_reasoning_effort: "medium"
  expose_reasoning_content: true

anthropic:
  default_model: "claude-3-5-sonnet"
  default_max_tokens: 4096
  expose_reasoning_content: true

proxy:
  enabled: false
  http_proxy: ""
  https_proxy: ""
  no_proxy: "localhost,127.0.0.1,::1,agy-net,agy-gateway"

auto_update:
  enabled: true
  interval: "6h"
  check_on_startup: true
  bin_dir: "/var/lib/agy-gateway/bin"
  agy_cli:
    enabled: true
    manifest_url: "https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests"
  agy_auth:
    enabled: true
    source: "github"
    release_repo: "fikrilal/agy-auth"

mcp:
  client_tool_calling:
    enabled: true
    default_parallel: true
    strict_schema_validation: true
    max_tool_argument_bytes: 16777216 # 16 MiB
    delimiter_tag: "tool_call"

observability:
  log_level: "info"
  log_format: "json"
  metrics_enabled: true
  metrics_path: "/metrics"
