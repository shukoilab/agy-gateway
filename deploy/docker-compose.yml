services:
  agy-gateway:
    image: agy-gateway:3.16.2
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: agy-gateway
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 140s
    ports:
      - "${AGY_GW_HOST_PORT:-${PORT:-8080}}:${AGY_GW_PORT:-${PORT:-8080}}"
    env_file:
      - .env
    environment:
      - AGY_GW_PORT=${AGY_GW_PORT:-${PORT:-8080}}
      - AGY_GW_HOST=${AGY_GW_HOST:-0.0.0.0}
      - AGY_GW_ADMIN_KEY=${AGY_GW_ADMIN_KEY:-admin-super-secret-key-change-me}
      - AGY_GW_CLIENT_KEY_1=${AGY_GW_CLIENT_KEY_1:-sk-antigravity-dev-test}
      - AGY_GW_POOL_WORKER_COUNT=${AGY_GW_POOL_WORKER_COUNT:-2}
      - AGY_GW_LOG_LEVEL=${AGY_GW_LOG_LEVEL:-info}
      - AGY_GW_LOG_FORMAT=${AGY_GW_LOG_FORMAT:-json}
      - AGY_GW_DEFAULT_MODEL=${AGY_GW_DEFAULT_MODEL:-gemini-3.8-flash}
      - AGY_GW_DEFAULT_REASONING_EFFORT=${AGY_GW_DEFAULT_REASONING_EFFORT:-medium}
      - AGY_GW_STRICT_CLIENT_TOOL_DELEGATION=${AGY_GW_STRICT_CLIENT_TOOL_DELEGATION:-true}
      - AGY_AUTH_NO_UPDATE_CHECK=1
      # Outbound Proxy Configuration (Optional - Docker layer & container egress)
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1,agy-net,agy-gateway}
      - http_proxy=${http_proxy:-${HTTP_PROXY:-}}
      - https_proxy=${https_proxy:-${HTTPS_PROXY:-}}
      - no_proxy=${no_proxy:-${NO_PROXY:-localhost,127.0.0.1,::1,agy-net,agy-gateway}}
      - ALL_PROXY=${ALL_PROXY:-}
      - all_proxy=${all_proxy:-${ALL_PROXY:-}}
      - AGY_GW_PROXY_ENABLED=${AGY_GW_PROXY_ENABLED:-}
      - AGY_GW_PROXY_HTTP_PROXY=${AGY_GW_PROXY_HTTP_PROXY:-}
      - AGY_GW_PROXY_HTTPS_PROXY=${AGY_GW_PROXY_HTTPS_PROXY:-}
      - AGY_GW_PROXY_NO_PROXY=${AGY_GW_PROXY_NO_PROXY:-}
      - NODE_USE_ENV_PROXY=1
      # Background Auto-Updater (Optional - Cron engine for agy CLI and agy-auth)
      - AGY_GW_AUTO_UPDATE_ENABLED=${AGY_GW_AUTO_UPDATE_ENABLED:-true}
      - AGY_GW_AUTO_UPDATE_INTERVAL=${AGY_GW_AUTO_UPDATE_INTERVAL:-6h}
      - AGY_GW_AUTO_UPDATE_ON_STARTUP=${AGY_GW_AUTO_UPDATE_ON_STARTUP:-true}
      - AGY_GW_AUTO_UPDATE_BIN_DIR=${AGY_GW_AUTO_UPDATE_BIN_DIR:-/var/lib/agy-gateway/bin}
    volumes:
      - agy-bin:/var/lib/agy-gateway/bin
      - agy-vault-data:/var/lib/agy-gateway/vault-xdg
      - agy-workspaces:/var/lib/agy-gateway/workspaces
      - agy-workers:/var/lib/agy-gateway/workers
      - home-agygw:/home/agygw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "4G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    healthcheck:
      test: ["CMD", "/usr/local/bin/agy-gateway", "-config", "/etc/agy-gateway/config.yaml", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - agy-net

networks:
  agy-net:
    driver: bridge

volumes:
  agy-bin:
  agy-vault-data:
  agy-workspaces:
  agy-workers:
  home-agygw:
