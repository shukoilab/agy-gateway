name: CI & Release Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Enforce Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Enforce Version Consistency
        run: |
          scripts/version.sh verify
          scripts/version_test.sh

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Test Suite with Race Detector
        run: go test -v -race ./...

      - name: Verify Binary Compilation
        run: go build -v -trimpath -o /dev/null ./cmd/agy-gateway

  release:
    name: Auto Bump Version, Release & GHCR Package
    needs: [ci]
    if: >-
      github.repository == 'shukoilab/agy-gateway' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version and Create Git Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          release_branches: "main"
          create_annotated_tag: true
          dry_run: true

      - name: Synchronize Version Across Repository
        if: steps.tag_version.outputs.new_tag != ''
        env:
          VERSION: ${{ steps.tag_version.outputs.new_version }}
          NOTES: ${{ steps.tag_version.outputs.changelog }}
        run: |
          printf '%s' "${NOTES:-}" | scripts/version.sh changelog "$VERSION"
          scripts/version.sh bump "$VERSION"
          scripts/version.sh verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "no version delta to commit; tagging HEAD"
          else
            git commit -m "chore(release): v$VERSION"
          fi
          # Retry-safe: an existing tag (fetched via fetch-depth: 0) must not abort the step.
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists; reusing it"
          else
            git tag -a "v$VERSION" -m "v$VERSION"
          fi
          # Atomic so a rejected main push cannot strand a release tag on the remote.
          git push --atomic origin "HEAD:main" "refs/tags/v$VERSION"

      - name: Normalize Repository Name for Container Registry
        id: repo_name
        run: |
          echo "image_name=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: steps.tag_version.outputs.new_tag != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.tag_version.outputs.new_tag != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.tag_version.outputs.new_tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        if: steps.tag_version.outputs.new_tag != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo_name.outputs.image_name }}
          tags: |
            type=raw,value=${{ steps.tag_version.outputs.new_tag }}
            type=raw,value=${{ steps.tag_version.outputs.new_version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=agy-gateway
            org.opencontainers.image.description=High-Performance OpenAI-Compatible Bridge for Google Antigravity CLI
            org.opencontainers.image.vendor=ShukoiLab
            org.opencontainers.image.version=${{ steps.tag_version.outputs.new_version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and Push Docker Package to GHCR
        if: steps.tag_version.outputs.new_tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.tag_version.outputs.new_version }}

      - name: Create GitHub Release
        if: steps.tag_version.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
