server:
  host: "0.0.0.0"
  port: 8080
  read_header_timeout: "10s"
  idle_timeout: "300s"
  shutdown_drain_timeout: "120s"
  max_request_body_bytes: 104857600 # 100 MiB (supports 1M+ context & multimodal payloads)
  sse_keepalive_interval: "15s"

security:
  api_keys:
    - id: "prod-client-1"
      key_env: "AGY_GW_CLIENT_KEY_1"
      key: "sk-antigravity-dev-test"
      rate_limit_rpm: 120
  admin_api_key_env: "AGY_GW_ADMIN_KEY"
  admin_api_key: "admin-super-secret-key-change-me"
  allowed_cors_origins: []

binaries:
  agy_path: "/usr/local/bin/agy"
  agy_min_version: "1.5.16"
  agy_auth_path: "/usr/local/bin/agy-auth"

# Identity presented to the ACP agent during initialize. "zed" sends the reference editor
# fingerprint that agy was verified against; "gateway" reports this process instead. The version
# string is data (config/env), never a code literal, so it can track the verified reference.
identity:
  profile: "zed"
  name: "zed"
  title: "Zed"
  version: "1.30.2+stable.398.610ea4b8de1c6e887f03563f067278002f41256e"

# Client capabilities advertised to the ACP agent. "zed" advertises filesystem and terminal
# access (the gateway implements both handlers); "sandbox" advertises none of them. Advertising a
# capability without its handler stalls the turn, so the profiles always match the implementation.
capabilities:
  profile: "zed"
  fs: true
  terminal: true
  elicitation: true
  session_metadata: true

execution:
  # The ACP argv is fixed by the gateway (always --dangerously-skip-permissions) and the system
  # prompt is always delivered as the first prompt block; neither is configurable.
  # auto forwards image content to agy, which decodes and describes it natively; reject refuses
  # image input with a provider-native 400 (for deployments that must not accept binary payloads).
  vision_mode: "auto"
  clean_workspace_between_requests: true
  max_retries: 3
  retry_initial_backoff: "500ms"
  retry_max_backoff: "10s"
  # Bound on the conversation history forwarded to agy per turn (estimated tokens, ~4 chars each).
  # Above ~100K tokens the agent stops converging and repeats the same tool calls, so the budget is
  # enforced by compacting oldest tool results first — keeping the head and tail of each — which
  # preserves every assistant turn. Whole turns are only dropped when prose alone exceeds the budget,
  # and then the opening turn and the newest turns are kept. 0 disables the bound.
  max_history_tokens: 60000
  # ACP can only set model, thought_level and mode, so every other sampling parameter a client
  # sends (temperature, top_p, max_tokens, ...) is structurally absent upstream. "ignore" accepts
  # them and names them in the X-Agy-Ignored-Params response header; "reject" answers a
  # provider-native invalid_request_error naming the first unsupported parameter.
  unsupported_parameter_policy: "ignore"
  # Media policy for consumer-supplied image references. Remote fetches are a server-side request
  # forgery surface, so they are bounded and private/link-local addresses are refused.
  media:
    allow_remote: true
    max_bytes: 8388608
    fetch_timeout: "10s"
    allowed_mime_types: ["image/png", "image/jpeg", "image/gif", "image/webp"]
    allow_private_hosts: false

storage:
  base_data_dir: "/var/lib/agy-gateway"
  vault_xdg_config_dir: "/var/lib/agy-gateway/vault-xdg"
  workers_root_dir: "/var/lib/agy-gateway/workers"
  workers_tmp_dir: "/var/lib/agy-gateway/tmp"
  workspaces_root_dir: "/var/lib/agy-gateway/workspaces"

pool:
  worker_count: 2
  acquire_timeout: "15s"
  handshake_timeout: "15s"
  config_switch_timeout: "10s"
  inference_timeout: "900s"
  first_token_timeout: "120s"
  process_kill_grace_period: "5s"
  max_requests_per_worker: 250
  max_worker_uptime: "2h"
  max_scanner_buffer_bytes: 134217728 # 128 MiB (prevents buffer overflow on 1M token turns)

accounts:
  auto_rotate_enabled: true
  # round_robin: spread by index | least_used: greedy over live quota and claim counts |
  # sticky: persist per-worker affinity in <base_data_dir>/state/worker-bindings.json, honouring a
  # binding only while the account still exists, is usable, and is not claimed by an earlier worker.
  allocation_strategy: "round_robin"
  quota_poll_interval: "30s"
  min_remaining_quota_pct: 5.0
  default_cooldown_5h: "30m"
  default_cooldown_weekly: "24h"
  max_failover_retries: 3
  # Bounded retry for a runtime credential fault; a vault-reported expiry stays permanent.
  auth_expired_retry_interval: "5m"

admin:
  command_timeout: "15s"
  allow_credential_export: false
  query_validation_regex: "^[a-zA-Z0-9@._:-]{1,128}$"
  alias_validation_regex: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,62}$"
  runtime_overrides_file: "/var/lib/agy-gateway/vault-xdg/gateway-runtime-overrides.json"
  oauth_onboarding:
    enabled: true
    max_concurrent_logins: 3
    url_extract_timeout: "10s"
    login_session_ttl: "5m"
    loopback_replay_timeout: "15s"

openai:
  default_model: "gemini-3.8-flash"
  default_reasoning_effort: "medium"
  expose_reasoning_content: true

anthropic:
  default_model: "claude-3-5-sonnet"
  default_max_tokens: 4096
  expose_reasoning_content: true

proxy:
  enabled: false
  http_proxy: ""
  https_proxy: ""
  no_proxy: "localhost,127.0.0.1,::1,agy-net,agy-gateway"

auto_update:
  enabled: true
  interval: "6h"
  check_on_startup: true
  bin_dir: "/var/lib/agy-gateway/bin"
  agy_cli:
    enabled: true
    manifest_url: "https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests"
  agy_auth:
    enabled: true
    source: "github"
    release_repo: "fikrilal/agy-auth"

mcp:
  client_tool_calling:
    enabled: true
    strict_schema_validation: true
    max_tool_argument_bytes: 16777216 # 16 MiB (supports large context tool returns)
    max_client_tools: 128
    max_intercepted_tool_calls: 16
    # Idle watchdog: a turn is only ended after the agent goes this long WITHOUT emitting any
    # text/thought chunk while the gateway already holds collected tool calls. Re-armed by every
    # streamed chunk, and followed by one more window of grace before the prompt is cancelled.
    tool_call_collect_window: "1s"
    delimiter_tag: "tool_call"

observability:
  log_level: "info"
  log_format: "json"
  metrics_enabled: true
  metrics_path: "/metrics"
